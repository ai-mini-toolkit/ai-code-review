# E2E Test Profile Configuration
# Used with @ActiveProfiles("e2e") + TestContainers
# DataSource URL and Redis host/port are injected dynamically via @DynamicPropertySource
# in AbstractE2ETest - these values here are placeholders overridden at runtime.

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false  # Allow clean in E2E tests for isolation

  data:
    redis:
      database: 0
      lettuce:
        pool:
          max-active: 5
          max-idle: 2
          min-idle: 1
          max-wait: 3000ms

  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
      key-prefix: "aicodereview:e2e:cache:"
      use-key-prefix: true

  mail:
    host: localhost
    port: 25
    username: ""
    password: ""

app:
  encryption:
    key: e2e-test-key-32chars-padding123!

# Route AI calls to MockAIProvider (id="mock-ai") so no real API calls are made during E2E tests.
ai:
  provider:
    default: mock-ai
    fallback: mock-ai

logging:
  level:
    com.aicodereview: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: INFO
